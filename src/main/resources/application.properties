spring.application.name=librotech

# Conexion a Base de Datos H2 persistente en archivo
spring.datasource.url=jdbc:h2:file:./data/librotech_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2 para visualizacion
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ===============================
# ChatTech - MongoDB
# ===============================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://librotech:librotech@localhost:27017/librotech_chat?authSource=admin}

# ===============================
# ChatTech - Spring AI / OpenAI
# ===============================
spring.ai.model.chat=${AI_CHAT_MODEL:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# Origenes permitidos para el endpoint WebSocket, separados por comas
chat.websocket.allowed-origins=${CHAT_ALLOWED_ORIGINS:http://localhost:8080}
