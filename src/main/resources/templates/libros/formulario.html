<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tituloPantalla}">Formulario</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        .container { margin: 20px 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 8px; width: 300px; }
        button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 4px; }
        .btn-cancel { background-color: #f44336; text-decoration: none; display: inline-block; padding: 10px 15px; color: white; border-radius: 4px; }
        .alert-error { background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div th:replace="~{layout/componentes :: navbar}"></div>

<div class="container">
    <h1 th:text="${tituloPantalla}">Nuevo Libro</h1>

    <div th:if="${errorAnio}" class="alert-error">
        <strong th:text="${errorAnio}">Mensaje de error generico</strong>
    </div>

    <form th:action="@{/admin/libros/guardar}" th:object="${libro}" method="post">
        <div class="form-group">
            <label for="titulo">Titulo del Libro:</label>
            <input type="text" th:field="*{titulo}" required />
        </div>

        <div class="form-group">
            <label for="autor">Autor:</label>
            <input type="text" th:field="*{autor}" required />
        </div>

        <div class="form-group">
            <label for="isbn">ISBN:</label>
            <input type="text" th:field="*{isbn}" required />
        </div>

        <div class="form-group">
            <label for="anioPublicacion">Anio de Publicacion:</label>
            <input type="number" th:field="*{anioPublicacion}" required />
        </div>

        <button type="submit">Guardar Libro</button>
        <a th:href="@{/admin/libros}" class="btn-cancel">Cancelar</a>
    </form>
</div>

<div th:replace="~{layout/componentes :: footer}"></div>

</body>
</html>
